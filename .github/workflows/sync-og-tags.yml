name: Sync OG Tags with oggi.json

on:
  push:
    branches:
      - main
    paths:
      - 'oggi.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-og:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run OG tags sync script
        run: python scripts/sync-og-tags.py

      - name: Commit and push changes if index.html modified
        run: |
          if ! git diff --quiet index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Sync OG tags with oggi.json [skip ci]"
            git push
          else
            echo "No changes in index.html. Skipping commit."
          fi
